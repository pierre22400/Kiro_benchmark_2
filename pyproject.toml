[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-timeline"
version = "0.1.0"
description = "Deterministic local JSONL evidence timeline CLI"
requires-python = ">=3.11"

[project.scripts]
evidence-timeline = "evidence_timeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
